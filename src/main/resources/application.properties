spring.application.name=usuarios
server.port=8080
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/usuariosdb?currentSchema=usuarios_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=usuarios_schema
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

instance.tag=${INSTANCE_TAG:app-local}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
